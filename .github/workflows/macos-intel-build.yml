name: Build Cage for Intel Mac
on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit SHA to build
        required: true
        type: string
      artifact_name:
        description: Name of the resulting workflow artifact
        required: true
        type: string
permissions:
  contents: read

jobs:
  checks:
    # The runtime is built natively; hosted runners cannot boot nested guests.
    runs-on: macos-15-intel
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the exact source and Intel runner
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Pass an exact commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]]
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install native guest and Intel runtime build dependencies
        run: |
          brew install glib gettext pcre2 libffi pixman pkgconf meson ninja
          brew upgrade glib gettext pcre2
      # The runtime build is incremental inside _output/intel-runtime. The key
      # names every input its compiled files depend on, so any change rebuilds.
      - name: Describe the Intel runtime build inputs
        id: runtime-inputs
        run: |
          {
            sw_vers -productVersion
            xcrun --show-sdk-path
            xcrun --show-sdk-version
            xcodebuild -version
            python3 --version
            command -v python3
            brew list --versions
          } > "$RUNNER_TEMP/intel-runtime-inputs"
          printf 'digest=%s\n' "$(shasum -a 256 "$RUNNER_TEMP/intel-runtime-inputs" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: _output/intel-runtime
          key: intel-runtime-${{ hashFiles('scripts/build-intel-macos-runtime.sh') }}-${{ steps.runtime-inputs.outputs.digest }}
      - name: Build the macOS application without release credentials
        env:
          CAGE_SIGNING_IDENTITY: '-'
          CAGE_BUILD_PYTHON: python3
          CAGE_BUILD_JOBS: '4'
        run: bash scripts/build-app.sh
      - name: Archive a complete development App with executable permissions
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p _output/ci-macos-test
          archive="$PWD/_output/ci-macos-test/Cage-$version-macos-amd64-test.tar.gz"
          tar -czf "$archive" -C _output Cage.app
          (cd _output/ci-macos-test && shasum -a 256 "${archive##*/}" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: _output/ci-macos-test/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14
